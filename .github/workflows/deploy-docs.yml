name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "common/src/**"
      - "paper/src/**"
      - "fabric/src/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Javadoc
        run: ./gradlew :common:javadoc :paper:javadoc :fabric:javadoc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        working-directory: docs
        run: pnpm run build

      - name: Merge Javadoc into site output
        run: |
          mkdir -p docs/dist/javadoc/common docs/dist/javadoc/paper docs/dist/javadoc/fabric
          cp -r common/build/docs/javadoc/. docs/dist/javadoc/common/
          cp -r paper/build/docs/javadoc/. docs/dist/javadoc/paper/
          cp -r fabric/build/docs/javadoc/. docs/dist/javadoc/fabric/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
